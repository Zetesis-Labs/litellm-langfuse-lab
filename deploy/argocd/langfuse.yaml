apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: langfuse
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-platform
  sources:
    - repoURL: https://langfuse.github.io/langfuse-k8s
      chart: langfuse
      targetRevision: 1.5.41
      helm:
        releaseName: langfuse
        valueFiles:
          - $values/deploy/values/langfuse-aws.yaml
    - repoURL: https://github.com/CAMBIAR/litellm-langfuse-lab.git # CAMBIAR
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    # El chart no fija réplicas cuando hay HPA/KEDA por delante.
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
