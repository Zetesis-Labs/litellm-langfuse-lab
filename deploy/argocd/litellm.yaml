apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: litellm
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  destination:
    server: https://kubernetes.default.svc
    namespace: llm-platform
  sources:
    - repoURL: ghcr.io/berriai
      chart: litellm-helm
      targetRevision: 1.89.2
      helm:
        releaseName: litellm
        valueFiles:
          - $values/deploy/values/litellm-aws.yaml
    - repoURL: https://github.com/CAMBIAR/litellm-langfuse-lab.git # CAMBIAR
      targetRevision: main
      ref: values
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas
# El chart publica el Job de migración con la anotación argocd.argoproj.io/hook: PreSync,
# así que las migraciones de Prisma corren antes de rodar los pods nuevos sin
# configuración adicional. Si el registro OCI requiere autenticación, registra el
# repositorio en ArgoCD con `--enable-oci` y credenciales de lectura de paquetes.
