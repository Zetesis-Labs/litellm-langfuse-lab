# Alternativa a crear los Secrets a mano: sincronizarlos desde AWS Secrets Manager
# con External Secrets Operator. Requiere el operador instalado y un rol de IRSA
# con permiso secretsmanager:GetSecretValue.
#
# Crea antes los secretos en AWS, por ejemplo:
#   aws secretsmanager create-secret --name llm-platform/langfuse \
#     --secret-string '{"nextauth-secret":"...","salt":"...","encryption-key":"...",
#                       "postgres-password":"...","redis-password":"...","clickhouse-password":"...",
#                       "init-project-public-key":"pk-lf-...","init-project-secret-key":"sk-lf-...",
#                       "init-user-email":"admin@example.com","init-user-password":"..."}'
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secretsmanager
  namespace: llm-platform
spec:
  provider:
    aws:
      service: SecretsManager
      region: eu-west-1 # CAMBIAR
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: langfuse-secrets
  namespace: llm-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: langfuse-secrets
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: llm-platform/langfuse
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-secrets
  namespace: llm-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: litellm-secrets
    creationPolicy: Owner
  data:
    - secretKey: PROXY_MASTER_KEY
      remoteRef:
        key: llm-platform/litellm
        property: master-key
    - secretKey: LITELLM_SALT_KEY
      remoteRef:
        key: llm-platform/litellm
        property: salt-key
    - secretKey: ANTHROPIC_API_KEY
      remoteRef:
        key: llm-platform/litellm
        property: anthropic-api-key
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: litellm-db
  namespace: llm-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secretsmanager
    kind: SecretStore
  target:
    name: litellm-db
    creationPolicy: Owner
  data:
    - secretKey: username
      remoteRef:
        # Si la contraseña la gestiona RDS, apunta al secreto que crea RDS.
        key: rds!db-abcdefgh-1234-5678-90ab-cdef12345678
        property: username
    - secretKey: password
      remoteRef:
        key: rds!db-abcdefgh-1234-5678-90ab-cdef12345678
        property: password
